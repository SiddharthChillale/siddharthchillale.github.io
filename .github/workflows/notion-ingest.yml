name: notion-ingest

# Drains the Notion "Blog Queue" of pages marked Ready and opens one pull
# request per post.
#
# Polling rather than webhooks is deliberate. `Status` is a queue and this
# workflow drains it: each page is flipped to Drafted only once its pull
# request exists, so a run that dies halfway leaves the page Ready and the next
# run picks it up. A dropped webhook would lose a post silently.

on:
  schedule:
    # Twice a day. GitHub queues scheduled runs and drops them under load, so
    # treat these times as "eventually" rather than "at".
    - cron: '0 7,19 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Maximum pages to ingest in this run'
        required: false
        default: '3'

concurrency:
  # Never overlap: two runs would race to claim the same Ready pages.
  group: notion-ingest
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  ingest:
    runs-on: ubuntu-latest

    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      # Lifted out of `secrets` purely so the step below can test it: the
      # `secrets` context is not available in a step-level `if`.
      CONTENT_BOT_CLIENT_ID: ${{ secrets.CONTENT_BOT_CLIENT_ID }}
      LIMIT: ${{ inputs.limit || '3' }}
      MANIFEST: ${{ github.workspace }}/.ingest-manifest.json

    steps:
      # A pull request opened with GITHUB_TOKEN does not trigger other
      # workflows — GitHub's loop guard — so ci.yml would never run and there
      # would be no preview deployment to review, which is the point of the
      # loop. A GitHub App installation token is not subject to that guard.
      #
      # Preferred over a personal access token because it is not tied to one
      # person's account and there is no expiry date to diarise: the token is
      # minted per run, lives about an hour, and is revoked automatically when
      # the job ends.
      #
      # Without the App secrets this step is skipped and everything downstream
      # falls back to GITHUB_TOKEN, so the ingest still opens a pull request —
      # just a preview-less one.
      - name: Mint a GitHub App token
        id: app-token
        if: env.CONTENT_BOT_CLIENT_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          # `client-id`, not `app-id`: the latter is deprecated by the action.
          client-id: ${{ secrets.CONTENT_BOT_CLIENT_ID }}
          private-key: ${{ secrets.CONTENT_BOT_PRIVATE_KEY }}
          # Narrow the minted token to what the ingest actually does, rather
          # than inheriting everything the installation is allowed to do.
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      # Screen-recording GIFs out of Notion are routinely an order of magnitude
      # larger than the equivalent H.264 clip. The ingest degrades gracefully
      # without ffmpeg, but then ships the GIF.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - run: bun install --frozen-lockfile

      - name: Ingest from Notion
        id: ingest
        # A page that fails to convert must not block the pages that succeeded,
        # so failures are collected and re-raised after the pull requests exist.
        continue-on-error: true
        run: bun run notion:ingest --limit "$LIMIT" --manifest "$MANIFEST"

      - name: Check for ingested posts
        id: check
        run: |
          if [ ! -s "$MANIFEST" ] || [ "$(jq 'length' "$MANIFEST")" -eq 0 ]; then
            echo "count=0" >> "$GITHUB_OUTPUT"
            echo "Nothing marked Ready. Done."
          else
            echo "count=$(jq 'length' "$MANIFEST")" >> "$GITHUB_OUTPUT"
          fi

      # The same gate ci.yml runs, applied before anything is committed. A post
      # that violates the schema should fail here, where the output names the
      # offending field, rather than later as a build error.
      - name: Validate content
        if: steps.check.outputs.count != '0'
        run: bun run validate:content

      - name: Open a pull request per post
        if: steps.check.outputs.count != '0'
        env:
          # Must be set here rather than on the job: job-level `env` is
          # evaluated before any step runs, so it cannot see `steps` outputs.
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail

          # Attribute commits to the App when there is one, so the history
          # shows which identity wrote the post.
          if [ -n "${APP_SLUG:-}" ]; then
            git config user.name  "$APP_SLUG[bot]"
            git config user.email "$APP_SLUG[bot]@users.noreply.github.com"
          else
            git config user.name  'notion-ingest'
            git config user.email 'notion-ingest@users.noreply.github.com'
          fi

          base_sha=$(git rev-parse HEAD)

          jq -c '.[]' "$MANIFEST" | while read -r entry; do
            page_id=$(jq -r '.pageId'     <<< "$entry")
            notion_url=$(jq -r '.notionUrl' <<< "$entry")
            title=$(jq -r '.title'        <<< "$entry")
            collection=$(jq -r '.collection' <<< "$entry")
            slug=$(jq -r '.slug'          <<< "$entry")
            dir=$(jq -r '.dir'            <<< "$entry")

            branch="cms/$collection/$slug"
            echo "::group::$branch"

            # Each post branches from the same base so the pull requests stay
            # independent and can be merged, or dropped, in any order.
            git switch --force-create "$branch" "$base_sha"
            git add --force "$dir"
            git commit --message "Add $collection post: $title" \
                       --message "Ingested from Notion: $notion_url"
            git push --force-with-lease --set-upstream origin "$branch"

            pr_url=$(gh pr create \
              --base "${{ github.ref_name }}" \
              --head "$branch" \
              --title "$collection: $title" \
              --body "$(printf '%s\n' \
                "Ingested from Notion by \`notion-ingest\`." \
                "" \
                "- Source: $notion_url" \
                "- Path: \`$dir/\`" \
                "" \
                "The post is committed with \`draft: true\`, so it is visible on the" \
                "preview deployment and invisible in production. Review the rendered" \
                "preview, leave review comments on anything that needs changing, and" \
                "clear the draft flag when it is ready to publish." \
              )")

            echo "opened $pr_url"

            # Only now is it safe to claim the page. Until this runs the page
            # stays Ready and a later run will retry it.
            bun run scripts/notion-set-status.ts \
              --page "$page_id" --status Drafted --pr "$pr_url"

            echo "::endgroup::"
          done

      - name: Re-raise ingest failures
        if: steps.ingest.outcome == 'failure'
        run: |
          echo "The ingest reported failures. See the 'Ingest from Notion' step."
          echo "Any page that converted successfully has had its pull request opened."
          exit 1
