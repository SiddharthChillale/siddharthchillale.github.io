<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="wa-title wa-desc">
  <title id="wa-title">One Git repository, three worktrees</title>
  <desc id="wa-desc">A shared .git object database at the top connects down to three separate worktree folders on disk — main, feature-x and hotfix — each with its own branch checked out.</desc>
  <style>
    .card { fill: #FDF8F6; }
    .box { fill: #FFFFFF; stroke: #1A1A2E; stroke-width: 2; }
    .git-box { fill: #F5F0EB; stroke: #1A1A2E; stroke-width: 2; }
    .line { stroke: #1A1A2E; stroke-width: 2; fill: none; }
    .accent { stroke: #E57373; }
    .txt { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1A1A2E; }
    .title { font-size: 15px; font-weight: 600; }
    .label { font-size: 13px; font-weight: 600; }
    .sub { font-size: 11.5px; fill: #6B6B7B; }
    .branch-dot { fill: #4F72A8; }
  </style>

  <rect class="card" x="0" y="0" width="720" height="400" rx="12"/>

  <!-- shared .git database -->
  <g>
    <ellipse class="git-box" cx="360" cy="52" rx="150" ry="26"/>
    <path class="line" d="M210 52v26c0 14.4 67.2 26 150 26s150-11.6 150-26V52" fill="#F5F0EB"/>
    <text class="txt label" x="360" y="47" text-anchor="middle">.git</text>
    <text class="txt sub" x="360" y="63" text-anchor="middle">shared objects · refs · history · remotes</text>
  </g>

  <!-- connectors -->
  <path class="line" d="M360 106v24M360 130 L140 130 L140 168" marker-end="url(#arrow)"/>
  <path class="line" d="M360 130v38" marker-end="url(#arrow)"/>
  <path class="line" d="M360 130 L580 130 L580 168" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#1A1A2E"/>
    </marker>
  </defs>

  <!-- worktree: main -->
  <g>
    <rect class="box" x="50" y="170" width="180" height="150" rx="10"/>
    <circle class="branch-dot" cx="72" cy="196" r="4"/>
    <text class="txt label" x="86" y="200">main/</text>
    <text class="txt sub" x="70" y="222">branch: main</text>
    <line class="line" x1="70" y1="236" x2="210" y2="236"/>
    <text class="txt sub" x="70" y="256">terminal: idle</text>
    <text class="txt sub" x="70" y="274">node_modules ✓</text>
    <text class="txt sub" x="70" y="292">.env (copied)</text>
  </g>

  <!-- worktree: feature-x -->
  <g>
    <rect class="box accent" x="270" y="170" width="180" height="150" rx="10"/>
    <circle class="branch-dot" cx="292" cy="196" r="4"/>
    <text class="txt label" x="306" y="200">feature-x/</text>
    <text class="txt sub" x="290" y="222">branch: feature-x</text>
    <line class="line" x1="290" y1="236" x2="430" y2="236"/>
    <text class="txt sub" x="290" y="256">terminal: Claude running</text>
    <text class="txt sub" x="290" y="274">node_modules ✓</text>
    <text class="txt sub" x="290" y="292">.env (copied)</text>
  </g>

  <!-- worktree: hotfix -->
  <g>
    <rect class="box" x="490" y="170" width="180" height="150" rx="10"/>
    <circle class="branch-dot" cx="512" cy="196" r="4"/>
    <text class="txt label" x="526" y="200">hotfix/</text>
    <text class="txt sub" x="510" y="222">branch: hotfix</text>
    <line class="line" x1="510" y1="236" x2="650" y2="236"/>
    <text class="txt sub" x="510" y="256">terminal: idle</text>
    <text class="txt sub" x="510" y="274">node_modules ✓</text>
    <text class="txt sub" x="510" y="292">.env (copied)</text>
  </g>

  <text class="txt sub" x="360" y="366" text-anchor="middle">Same commits and remotes everywhere — different files and a different branch checked out per worktree.</text>
</svg>
