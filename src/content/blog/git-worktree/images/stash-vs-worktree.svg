<svg viewBox="0 0 720 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sw-title sw-desc">
  <title id="sw-title">Stashing versus worktrees when a bug interrupts feature work</title>
  <desc id="sw-desc">With stashing, feature work is paused on a single lane while you stash, switch, fix and switch back. With worktrees, the bug fix runs on its own parallel lane while feature work keeps going undisturbed.</desc>
  <style>
    .card { fill: #FDF8F6; }
    .lane-label { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #1A1A2E; }
    .step { fill: #FFFFFF; stroke: #1A1A2E; stroke-width: 2; }
    .step-pause { fill: #FDECEA; stroke: #E57373; stroke-width: 2; }
    .step-ok { fill: #EAF1FB; stroke: #4F72A8; stroke-width: 2; }
    .txt { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1A1A2E; font-size: 11.5px; font-weight: 600; }
    .arrow { stroke: #1A1A2E; stroke-width: 2; fill: none; }
    .sub { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 11.5px; fill: #6B6B7B; }
  </style>

  <rect class="card" x="0" y="0" width="720" height="460" rx="12"/>

  <!-- Section 1: stashing -->
  <text class="lane-label" x="30" y="38">With stashing — one lane, work pauses</text>

  <g>
    <rect class="step" x="30" y="58" width="100" height="46" rx="8"/>
    <text class="txt" x="80" y="86" text-anchor="middle">feature work</text>

    <path class="arrow" d="M130 81h28" marker-end="url(#arrow2)"/>
    <rect class="step-pause" x="158" y="58" width="86" height="46" rx="8"/>
    <text class="txt" x="201" y="86" text-anchor="middle">git stash</text>

    <path class="arrow" d="M244 81h24" marker-end="url(#arrow2)"/>
    <rect class="step-pause" x="268" y="58" width="86" height="46" rx="8"/>
    <text class="txt" x="311" y="80" text-anchor="middle">checkout</text>
    <text class="txt" x="311" y="94" text-anchor="middle">main</text>

    <path class="arrow" d="M354 81h24" marker-end="url(#arrow2)"/>
    <rect class="step-pause" x="378" y="58" width="86" height="46" rx="8"/>
    <text class="txt" x="421" y="86" text-anchor="middle">fix bug</text>

    <path class="arrow" d="M464 81h24" marker-end="url(#arrow2)"/>
    <rect class="step-pause" x="488" y="58" width="90" height="46" rx="8"/>
    <text class="txt" x="533" y="80" text-anchor="middle">checkout</text>
    <text class="txt" x="533" y="94" text-anchor="middle">feature</text>

    <path class="arrow" d="M578 81h20" marker-end="url(#arrow2)"/>
    <rect class="step-pause" x="598" y="58" width="92" height="46" rx="8"/>
    <text class="txt" x="644" y="86" text-anchor="middle">stash pop</text>
  </g>
  <text class="sub" x="30" y="126">Six manual steps, hope the pop applies cleanly, and the AI agent's context is gone for the ride.</text>

  <line x1="30" y1="150" x2="690" y2="150" stroke="#E8E4E1" stroke-width="1.5"/>

  <!-- Section 2: worktrees -->
  <text class="lane-label" x="30" y="184">With worktrees — two lanes, nothing pauses</text>

  <!-- lane A: feature keeps running -->
  <text class="sub" x="30" y="210">worktree: feature-x/</text>
  <g>
    <rect class="step-ok" x="30" y="218" width="200" height="46" rx="8"/>
    <text class="txt" x="130" y="246" text-anchor="middle">Claude keeps building the feature</text>
    <path class="arrow" d="M230 241h430" marker-end="url(#arrow2)"/>
    <rect class="step-ok" x="470" y="218" width="190" height="46" rx="8"/>
    <text class="txt" x="565" y="246" text-anchor="middle">feature work, uninterrupted</text>
  </g>

  <!-- lane B: hotfix happens in parallel -->
  <text class="sub" x="30" y="300">worktree: hotfix/</text>
  <g>
    <rect class="step-ok" x="30" y="308" width="160" height="46" rx="8"/>
    <text class="txt" x="110" y="336" text-anchor="middle">open new worktree</text>
    <path class="arrow" d="M190 331h24" marker-end="url(#arrow2)"/>
    <rect class="step-ok" x="222" y="308" width="120" height="46" rx="8"/>
    <text class="txt" x="282" y="336" text-anchor="middle">fix bug</text>
    <path class="arrow" d="M342 331h24" marker-end="url(#arrow2)"/>
    <rect class="step-ok" x="374" y="308" width="140" height="46" rx="8"/>
    <text class="txt" x="444" y="336" text-anchor="middle">push &amp; merge</text>
  </g>

  <!-- bracket showing simultaneity -->
  <path class="arrow" d="M18 218 v136 M18 218 h8 M18 354 h8" stroke="#4F72A8"/>
  <text class="sub" x="8" y="290" transform="rotate(-90 8 290)" text-anchor="middle" fill="#4F72A8">at the same time</text>

  <text class="sub" x="30" y="404">One directory keeps shipping the feature; the other fixes main. Same repo, same history, zero collisions.</text>

  <defs>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#1A1A2E"/>
    </marker>
  </defs>
</svg>
